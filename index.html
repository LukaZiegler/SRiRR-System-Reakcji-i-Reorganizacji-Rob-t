<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SRR — Sistema de Reacción y Reorganización de Obra</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1016;--p:#131921;--p2:#1a222d;--ln:#283341;--tx:#d9e0e8;--mu:#8a97a8;--ac:#38bdf8;--g:#22c55e;--y:#facc15;--r:#ef4444;
--hd:'Barlow Condensed','Arial Narrow',sans-serif;--bd:'IBM Plex Sans',system-ui,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0}
html{font-size:clamp(14px,.5vw + 9px,30px);scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:var(--bd);line-height:1.5;min-height:100vh;
background-image:linear-gradient(rgba(56,189,248,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.045) 1px,transparent 1px);background-size:2.2rem 2.2rem}
main{width:min(100%,110rem);margin:0 auto;padding:clamp(1rem,2.5vw,3rem)}
h1,h2,h3{font-family:var(--hd);font-weight:600;line-height:1.1}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.6rem}
header{border-left:.35rem solid var(--ac);padding:.2rem 0 .2rem 1.2rem;flex:1;min-width:18rem}
h1{font-size:clamp(1.9rem,3.8vw,3.8rem);letter-spacing:.01em}
header p{color:var(--mu);margin-top:.4rem}
.tools{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.btn{font:600 .85rem var(--bd);background:transparent;color:var(--ac);border:1px solid var(--ac);padding:.4rem .9rem;cursor:pointer;transition:.15s}
.btn:hover,.btn:focus-visible,.btn.on{background:var(--ac);color:#04121a;outline:none}
.lang{display:flex}.lang .btn+.btn{border-left:0}
.chain{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 1.6rem}
.chain button{font:600 .85rem var(--hd);letter-spacing:.04em;background:var(--p);color:var(--tx);border:1px solid var(--ln);padding:.35rem .7rem;cursor:pointer;transition:.15s}
.chain button:hover,.chain button:focus-visible{border-color:var(--ac);color:var(--ac);outline:none}
.chain i{font-style:normal;color:var(--ac);margin-right:.4rem}
.tx{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.8rem;margin-bottom:1.6rem}
.tx div{background:var(--p);border:1px solid var(--ln);border-top:.2rem solid var(--ac);padding:.9rem 1rem}
.tx h3{font-size:1.25rem;color:var(--ac)}
.tx p{font-size:.95rem}
.bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:.7rem;flex-wrap:wrap}
.bar h2{font-size:1.5rem;color:var(--mu);font-weight:500;letter-spacing:.05em}
.bar .btn{margin-left:.4rem}
details{background:var(--p);border:1px solid var(--ln);border-left:.3rem solid var(--ln);margin-bottom:.55rem;transition:border-color .2s}
details[open]{border-left-color:var(--ac);background:var(--p2)}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:1rem;padding:.9rem 1.1rem}
summary::-webkit-details-marker{display:none}
summary:focus-visible{outline:2px solid var(--ac);outline-offset:-2px}
summary:hover{background:rgba(56,189,248,.06)}
.num{font:700 1.6rem var(--hd);color:var(--ac);min-width:2.2rem}
summary h3{font-size:clamp(1.25rem,1.9vw,1.9rem);flex:1;letter-spacing:.01em}
summary h3 small{font:400 .9rem var(--bd);color:var(--mu);margin-left:.8rem;letter-spacing:0}
summary::after{content:"+";font:500 1.8rem var(--hd);color:var(--ac);transition:transform .25s}
details[open] summary::after{transform:rotate(45deg)}
.body{padding:.4rem 1.2rem 1.3rem 4.4rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(19rem,1fr));gap:1.1rem;animation:o .25s ease}
@keyframes o{from{opacity:0;transform:translateY(-.4rem)}to{opacity:1;transform:none}}
.blk{background:rgba(0,0,0,.22);border:1px solid var(--ln);padding:.9rem 1rem}
.blk.wide{grid-column:1/-1}
.blk h4{font:600 1.15rem var(--hd);color:var(--ac);margin-bottom:.45rem;letter-spacing:.03em}
.blk p{font-size:.95rem;margin-bottom:.4rem}
ul{list-style:none;padding:0}
.blk li{position:relative;padding:.14rem 0 .14rem 1.1rem;font-size:.95rem}
.blk li::before{content:"";position:absolute;left:0;top:.8em;width:.5rem;height:2px;background:var(--ac)}
.flow{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.flow span{background:var(--bg);border:1px solid var(--ln);padding:.25rem .6rem;font-size:.9rem}
.flow b{color:var(--ac)}
.note{border-left:.25rem solid var(--y);background:rgba(250,204,21,.07);padding:.6rem .9rem;font-size:.93rem}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{border:1px solid var(--ln);padding:.4rem .6rem;text-align:left}
th{background:var(--bg);color:var(--ac);font-family:var(--hd);font-size:1.05rem}
td:first-child{font-weight:600;white-space:nowrap}
.sec{margin-top:2.6rem}
.sec>h2{font-size:clamp(1.7rem,3vw,2.8rem);border-bottom:2px solid var(--ln);padding-bottom:.4rem;margin-bottom:.4rem}
.sec>h2 em{font-style:normal;color:var(--r)}
.sec>p{color:var(--mu);margin-bottom:1rem}
.gates{display:grid;grid-template-columns:repeat(auto-fit,minmax(22rem,1fr));gap:.9rem}
.gate{background:var(--p);border:1px solid var(--ln);border-top:.25rem solid var(--r);padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.5rem}
.gate h3{font-size:1.5rem}
.gate h3 i{font-style:normal;color:var(--r);margin-right:.5rem}
.gate .c{font-size:.95rem}
.gate ul{font-size:.9rem;color:var(--mu)}
.gate li::before{content:"› ";color:var(--r)}
.gate .a{margin-top:auto;border-top:1px dashed var(--ln);padding-top:.5rem;font-size:.92rem;font-weight:600}
.gate.last{border-top-color:var(--tx);grid-column:1/-1}
.sem{display:grid;grid-template-columns:repeat(auto-fit,minmax(24rem,1fr));gap:.9rem}
.lt{background:var(--p);border:1px solid var(--ln);border-top:.45rem solid var(--c);padding:1rem 1.2rem}
.lt h3{font-size:1.8rem;color:var(--c);display:flex;align-items:center;gap:.6rem}
.lt h3::before{content:"";width:1rem;height:1rem;border-radius:50%;background:var(--c);box-shadow:0 0 .8rem var(--c)}
.lt .w{color:var(--mu);font-size:.85rem;margin:.5rem 0 .2rem}
.lt ul{font-size:.93rem}
.lt li{padding:.1rem 0 .1rem 1rem;position:relative}
.lt li::before{content:"";position:absolute;left:0;top:.75em;width:.4rem;height:.4rem;background:var(--c)}
.lt .do{margin-top:.8rem;padding:.55rem .8rem;background:rgba(0,0,0,.3);border:1px solid var(--c);font-weight:600;font-size:.95rem}
footer{margin-top:3rem;padding-top:1.2rem;border-top:1px solid var(--ln);color:var(--mu);font-size:.85rem;text-align:center;display:flex;flex-direction:column;gap:.5rem;align-items:center}
footer b{color:var(--tx);font-weight:500}
footer .lnk{background:none;border:0;color:var(--ac);cursor:pointer;font:inherit;text-decoration:underline}
dialog{background:var(--p2);color:var(--tx);border:1px solid var(--ac);border-top:.35rem solid var(--ac);padding:0;width:min(92vw,52rem);max-height:88vh;margin:auto;overflow:hidden;flex-direction:column}
dialog[open]{display:flex;animation:o .25s ease}
dialog::backdrop{background:rgba(3,6,10,.78);backdrop-filter:blur(3px)}
dialog h2{font-size:1.8rem;padding:1.1rem 1.5rem .5rem}
dialog .dc{padding:.3rem 1.5rem 1rem;overflow:auto}
dialog .dc p{margin-bottom:.8rem;font-size:.97rem}
dialog .df{padding:.9rem 1.5rem;border-top:1px solid var(--ln);text-align:right}
@media(max-width:700px){.body{padding:.3rem .8rem 1rem}summary{padding:.8rem}.gate.last{grid-column:auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{details .body{display:grid}body{background:#fff}dialog{display:none!important}}
.lib .tools2{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin:.8rem 0 1rem}
#q{flex:1;min-width:14rem;background:var(--p);border:1px solid var(--ln);color:var(--tx);padding:.55rem .8rem;font:inherit;font-size:.95rem}
#q:focus{outline:2px solid var(--ac);border-color:var(--ac)}
.cnt{color:var(--mu);font-size:.85rem}
.badge{font:600 .8rem var(--bd);color:var(--mu);border:1px solid var(--ln);padding:.1rem .55rem}
.lbody{padding:.3rem 1.3rem 1.2rem 4.4rem;animation:o .25s ease}
.lbody h5{font:600 1.1rem var(--hd);color:var(--ac);letter-spacing:.04em;margin:.8rem 0 .3rem}
.lbody ul{columns:19rem;column-gap:2.2rem}
.lbody li{break-inside:avoid;position:relative;padding:.18rem 0 .18rem 1rem;font-size:.93rem}
.lbody li::before{content:"";position:absolute;left:0;top:.85em;width:.4rem;height:.4rem;background:var(--ln);border:1px solid var(--ac)}
.lbody .note{margin-top:.8rem}
@media(max-width:700px){.lbody{padding:.3rem .9rem 1rem}}
</style>

</head>
<body>
<main>
<div class="top">
<header>
<h1 id="h1"></h1>
<p id="sub"></p>
</header>
<div class="tools">
<button class="btn" id="scopeBtn"></button>
<div class="lang"><button class="btn" data-l="es">ES</button><button class="btn" data-l="pl">PL</button></div>
</div>
</div>

<nav class="chain" id="chain"></nav>
<section class="tx" id="tx"></section>

<div class="bar"><h2 id="phT"></h2><span><button class="btn" id="open"></button><button class="btn" id="close"></button></span></div>
<div id="acc"></div>

<section class="sec" id="semaforo"><h2 id="semT"></h2><p id="semP"></p><div class="sem" id="sem"></div></section>

<section class="sec lib" id="biblioteca"><h2 id="libT"></h2><p id="libP"></p><div class="note" id="libN"></div>
<div class="tools2"><input id="q" type="search"><span class="cnt" id="cnt"></span><button class="btn" id="lopen"></button><button class="btn" id="lclose"></button></div>
<div id="libAcc"></div></section>
<footer>
<div id="chainF"></div>
<b>Protocol prepared by Erinson Villarroel, Industrial Electrical Engineer.</b>

</footer>
</main>

<dialog id="disc" aria-labelledby="discT"><h2 id="discT">Disclaimer</h2><div class="dc" id="discB"></div><div class="df"><button class="btn on" data-close></button></div></dialog>
<dialog id="scope" aria-labelledby="scopeT"><h2 id="scopeT"></h2><div class="dc" id="scopeB"></div><div class="df"><button class="btn on" data-close></button></div></dialog>

<script>
const L=a=>({t:'ul',v:a}),P=s=>({t:'p',v:s}),F=a=>({t:'flow',v:a}),N=s=>({t:'note',v:s}),W=1;
const D={
es:{
 h1:'SRR — Sistema de Reacción y Reorganización de Obra',
 sub:'Marco personal de análisis y toma de decisiones ante situaciones imprevistas',
 scopeBtn:'Aviso de alcance',discLnk:'Ver disclaimer',ok:'Entendido',

 scopeT:'Aviso de alcance y carácter no oficial',
 scopeP:['Este documento es una propuesta personal de carácter orientativo y no constituye un procedimiento oficial de obra, una norma técnica, un procedimiento de seguridad, una instrucción de trabajo ni una guía para la dirección, ejecución, supervisión o firma de obras.','Su finalidad es exclusivamente presentar un método personal de organización y análisis ante situaciones imprevistas en un entorno de obra, con el objetivo de evitar decisiones impulsivas y estructurar la respuesta mediante la verificación del problema, evaluación de su impacto, análisis de alternativas, reorganización del trabajo, documentación y seguimiento.','Este sistema no sustituye la legislación aplicable, los proyectos y especificaciones técnicas, los procedimientos internos de la empresa, las instrucciones de los responsables de obra, las decisiones del diseñador/proyectista, las autorizaciones requeridas, las normas de seguridad y salud ni cualquier otra documentación o procedimiento obligatorio.','No pretende establecer qué solución técnica debe ejecutarse ante un problema concreto, ni atribuye al usuario autoridad para aprobar modificaciones, trabajos adicionales, cambios de proyecto, soluciones estructurales o cualquier otra actuación que requiera autorización profesional, contractual o legal.','Ante situaciones que excedan las competencias, autoridad, información disponible o capacidad de decisión de la persona que aplica este método, la actuación debe ser escalada al responsable competente.','En consecuencia, este documento debe entenderse como un marco personal de razonamiento y organización, no como un procedimiento técnico o legal para ejecutar una obra.'],
 S:[
 ['①','PROBLEMA','¿Qué ha ocurrido?',[
  ['Preguntas',0,[L(['¿Qué ha ocurrido?','¿Dónde?','¿Cuándo?','¿Qué actividad está afectada?','¿Quién está implicado?'])]],
  ['Clasificación',0,[P('¿Es un problema…?'),L(['técnico','logístico','contractual','organizativo','de seguridad'])]],
  ['Regla',0,[N('Describe hechos, no culpables. Aún no se decide nada: solo se identifica el problema.')]]]],
 ['②','VERIFICACIÓN','¿El problema realmente es lo que parece?',[
  ['Principio',0,[P('No se toman decisiones basándose únicamente en lo que dice una persona.')]],
  ['Compruebo',0,[L(['estado real de la obra','planos','especificaciones','medidas','fotografías','documentación disponible','información del subcontratista','estado de materiales y equipos','responsables involucrados'])]],
  ['Objetivo',0,[P('Separar el hecho de la interpretación del hecho.'),N('Ejemplo: el subcontratista dice «No podemos trabajar porque el otro equipo no terminó». Se comprueba qué parte falta exactamente: puede que solo falten 3 m y el 80 % del frente esté disponible. No hay una obra parada: hay un frente parcialmente bloqueado.')]]]],
 ['③','IMPACTO','¿Qué está afectando realmente?',[
  ['1. Seguridad',0,[L(['¿Hay peligro para personas?','¿Hay riesgo para estructura o materiales?','¿Puede producirse un accidente?','¿Hay que asegurar o detener una actividad de inmediato?'])]],
  ['2. Calidad',0,[L(['¿Puede generar una no conformidad?','¿Puede provocar retrabajo?','¿Puede afectar a trabajos posteriores?'])]],
  ['3. Plazo',0,[L(['¿Cuánto tiempo puede perderse?','¿Afecta a la ruta crítica?','¿Bloquea otras cuadrillas?'])]],
  ['4. Coste',0,[L(['horas improductivas','maquinaria parada','material desperdiciado','trabajos adicionales','posibles reclamaciones'])]],
  ['5. Organización',0,[L(['¿Cuántas personas quedan bloqueadas?','¿Qué otros equipos dependen de esta actividad?','¿Se puede trasladar la brigada?'])]],
  ['6. Consecuencias futuras',0,[P('Parte clave del método:'),N('¿La solución de hoy puede crear un problema mañana?')]]]],
 ['④','ANÁLISIS','¿Qué puedo hacer y con qué límites?',[
  ['A. Seguridad inmediata',0,[P('¿Existe un riesgo inmediato? Si es así:'),F(['asegurar','detener la actividad afectada','proteger a las personas','avisar al responsable competente']),N('Mientras exista peligro inmediato no se continúa el protocolo con normalidad.')]],
  ['B. Documentación técnica',0,[L(['proyecto','planos','especificaciones','instrucciones','protocolos','documentación del fabricante','revisiones existentes']),N('¿Tengo información suficiente para decidir de forma técnicamente segura? Si no, ya hay criterio de escalación.')]],
  ['C. Autorizaciones',0,[P('¿Tengo autoridad para decidir esto? Reorganizar una cuadrilla no es lo mismo que modificar una solución estructural.'),N('No confundir capacidad técnica para proponer con autoridad para aprobar.')]],
  ['D. Consecuencias a largo plazo',0,[L(['¿afecta a trabajos posteriores?','¿afecta a instalaciones?','¿afecta a acabados?','¿afecta a inspecciones?','¿afecta a la recepción de obra (odbiór)?','¿afecta a la documentación final?','¿puede crear un problema en mantenimiento?','¿la solución es reversible?'])]],
  ['E. Temporal o permanente',0,[P('Pregunta obligatoria: ¿la solución es temporal o definitiva?'),L(['¿cuánto tiempo?','¿hasta qué condición?','¿quién ejecuta la solución definitiva?','¿qué ocurre si dura más de lo previsto?'])]],
  ['F. Reversible o irreversible',0,[P('¿Puedo volver con seguridad a la solución original?'),N('Cuanto más irreversible la intervención, más prudente debe ser la decisión.')]]]],
 ['⑤','DECISIÓN','¿Existe una solución viable?',[
  ['Alternativas',0,[L(['A — solución original','B — solución alternativa','C — reorganización del trabajo','D — solución temporal']),P('Cada alternativa se evalúa contra todos los criterios y después se elige.')]],
  ['Criterios de evaluación',W,[{t:'tbl',h:['Criterio','Pregunta'],v:[['Seguridad','¿Es segura?'],['Técnica','¿Es técnicamente viable?'],['Documentación','¿Está respaldada?'],['Autorización','¿Tengo autoridad?'],['Tiempo','¿Permite mantener el programa?'],['Recursos','¿Tenemos personal, material y equipos?'],['Calidad','¿Cumple los requisitos?'],['Futuro','¿Genera problemas posteriores?'],['Reversibilidad','¿Podemos volver atrás?']]}]]]],
 ['⑥','REORGANIZACIÓN','¿Cómo evito que un problema se convierta en una parada?',[
  ['Pregunta clave',0,[P('Antes de decir «la actividad está bloqueada», preguntar:'),N('¿Qué otra cosa podemos hacer?')]],
  ['Ejemplo: no llega el material de fachada',W,[P('Reacción débil: esperamos el material.'),P('Reacción correcta:'),F(['verificar plazo de entrega','determinar el impacto','revisar frentes disponibles','trasladar la brigada temporalmente','adelantar otra actividad','mantener la logística en paralelo'])]],
  ['Resultado',W,[N('No se eliminó el problema. Se eliminó la parada.')]]]],
 ['⑦','EJECUCIÓN','Decisión tomada: ¿cómo se ejecuta?',[
  ['Definir',0,[L(['quién hace qué','dónde','cuándo','con qué recursos','qué condiciones deben cumplirse'])]],
  ['Si la solución es temporal',0,[N('Definir cuándo debe revisarse o sustituirse.')]]]],
 ['⑧','DOCUMENTACIÓN','Antes, durante y después cuando sea relevante',[
  ['Evidencias',0,[L(['fotografías','vídeos cuando proceda','medidas','ubicación','planos marcados','fecha y hora','participantes','comunicaciones','decisiones','autorizaciones','solución ejecutada'])]],
  ['Finalidad',0,[P('Documentar no es solo demostrar quién tuvo la culpa. Dentro de dos semanas alguien debe poder entender:'),F(['qué ocurrió','qué se decidió','por qué se decidió','qué se ejecutó'])]]]],
 ['⑨','SEGUIMIENTO','Cierre del ciclo',[
  ['Preguntas',0,[L(['¿El problema realmente está resuelto?','¿La solución temporal sigue siendo válida?','¿Se ejecutó correctamente?','¿Generó consecuencias nuevas?','¿Hay que actualizar documentación?','¿Hay trabajos posteriores afectados?','¿Necesitamos una solución definitiva?'])]],
  ['Resultado',0,[F(['CLOSED','ESCALATE / REOPEN'])]]]]

 G:[

 ['CONFLICTO CONTRACTUAL','Dos partes tienen posiciones distintas sobre quién debe hacer algo. Ejemplo: «No está en nuestro alcance».',['no convertir una discusión contractual en personal'],'Escala: contrato → alcance → responsabilidad → decisión. Mientras tanto, mantén otras actividades.'],

const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function parse(t){const cs=[];let c,g;t.split('\n').forEach(l=>{l=l.trim();if(!l)return;const k=l[0],v=l.slice(1);
 if(k=='@'){c={t:v,g:[],n:'',k:0};g=null;cs.push(c)}
 else if(k=='#'){g={h:v,i:[]};c.g.push(g)}
 else if(k=='!'){c.n=v}
 else{if(!g){g={h:'',i:[]};c.g.push(g)}g.i.push(l);c.k++}});return cs}
function renderLib(){
 const u=U[lang],q=norm($('q').value.trim()),cs=parse(LIB[lang]),
  was=[...document.querySelectorAll('#libAcc details[open]')].map(x=>x.id);
 $('libT').textContent=u.t;$('libP').textContent=u.p;$('libN').textContent=u.n;$('q').placeholder=u.ph;
 $('lopen').textContent=u.open;$('lclose').textContent=u.close;
 let tot=0,shown=0,h='';
 cs.forEach((c,i)=>{tot+=c.k;
  const gs=c.g.map(g=>({h:g.h,i:q?g.i.filter(x=>norm(x).includes(q)):g.i})).filter(g=>g.i.length);
  const n=gs.reduce((a,g)=>a+g.i.length,0);if(!n)return;shown+=n;
  h+=`<details id="c${i}"${(q||was.includes('c'+i))?' open':''}><summary><span class="num">${String(i+1).padStart(2,'0')}</span><h3>${c.t}</h3><span class="badge">${q?n+' '+u.of+' '+c.k:c.k}</span></summary><div class="lbody">${gs.map(g=>(g.h?`<h5>${g.h}</h5>`:'')+'<ul>'+g.i.map(x=>`<li>${x}</li>`).join('')+'</ul>').join('')}${c.n?`<div class="note">${c.n}</div>`:''}</div></details>`});
 $('libAcc').innerHTML=h||`<p class="cnt">${u.none}</p>`;
 $('cnt').textContent=(q?shown+' '+u.of+' ':'')+tot+' '+u.it;
}
const _r=render;render=function(){_r();renderLib()};
$('q').oninput=renderLib;
$('lopen').onclick=()=>document.querySelectorAll('#libAcc details').forEach(d=>d.open=true);
$('lclose').onclick=()=>document.querySelectorAll('#libAcc details').forEach(d=>d.open=false);
renderLib();
</script>
